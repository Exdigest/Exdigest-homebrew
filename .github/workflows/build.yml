name: Wii Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitpro:latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Upload .dol
        uses: actions/upload-artifact@v4
        with:
          name: wii-build
          path: |
            *.dol
            *.elf
