name: Wii Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/devkitpro/devkitppc:20240505

    steps:
      - uses: actions/checkout@v4

      - name: Show SDK
        run: |
          echo $DEVKITPRO
          ls $DEVKITPRO

      - name: Build
        run: |
          make

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: wii-build
          path: |
            **/*.dol
            **/*.elf
