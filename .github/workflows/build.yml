name: Wii Build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitppc:latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Wii SDK
        run: |
          dkp-pacman -Sy --noconfirm
          dkp-pacman -S --needed --noconfirm wii-dev

      - name: Build
        run: |
          make

      - name: Show files
        run: |
          find . -name "*.dol"
          find . -name "*.elf"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wii-build
          path: |
            **/*.dol
            **/*.elf
