name: Wii Build (Working)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitppc:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify devkitPro install
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          ls /opt || true
          ls $DEVKITPRO || true

      - name: Build
        run: |
          make
